[tool.poetry]
# Dependency/venv management only — the app runs as flat scripts, not an
# installed package, so we don't build a wheel.
name = "karaoke-subtitle-studio"
version = "2.0.0"
description = "Word-timed karaoke subtitle studio: turn Suno aligned-lyrics JSON into styled, animated ASS/SRT subtitles, edited in a server-authoritative web/Electron app over a Starlette daemon (HTTP/WS/MCP)."
authors = ["erez <erez@razor-labs.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
# Pillow is used only to measure FreeType glyph metrics so preview font sizing
# matches libass exactly. Degrades gracefully without it (falls back to a 0.82
# scale factor).
pillow = ">=9.0"

[tool.poetry.group.dev.dependencies]
# No hard dev deps: the Python suites run on stdlib only.

[tool.poetry.group.mcp]
optional = true

[tool.poetry.group.mcp.dependencies]
# MCP server support — only needed when running mcp_server/.
# Install with:  poetry install --with mcp
# The core app and test suites do NOT require this group.
mcp = ">=1.2"
uvicorn = ">=0.27"
httpx = ">=0.27"
websockets = ">=12"
python-multipart = ">=0.0.9"
