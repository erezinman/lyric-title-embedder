<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" />
<style>.ebox{width:120px;height:62px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.col.e{align-items:center;gap:9px}.col.e .nm{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2)}</style></head>
<body>
  <div class="eyebrow">Elevation &amp; glow</div>
  <div class="row" style="gap:22px">
    <div class="col e"><div class="ebox" style="box-shadow:var(--shadow-1)"></div><div class="nm">shadow-1</div></div>
    <div class="col e"><div class="ebox" style="box-shadow:var(--shadow-2)"></div><div class="nm">shadow-2</div></div>
    <div class="col e"><div class="ebox" style="box-shadow:var(--shadow-3)"></div><div class="nm">shadow-3</div></div>
    <div class="col e"><div class="ebox" style="background:var(--accent);box-shadow:var(--shadow-glow-accent)"></div><div class="nm">glow-accent</div></div>
    <div class="col e"><div class="ebox" style="border-color:var(--accent);box-shadow:var(--ring-accent)"></div><div class="nm">ring-accent</div></div>
  </div>
</body></html>
