<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" />
<style>.rbox{width:80px;height:64px;background:var(--surface-3);border:1px solid var(--border-strong)}
.col.r{align-items:center;gap:8px}.col.r .nm{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2)}.col.r .hex{font-family:var(--font-mono);font-size:10px;color:var(--text-3)}</style></head>
<body>
  <div class="eyebrow">Corner radii</div>
  <div class="row">
    <div class="col r"><div class="rbox" style="border-radius:var(--radius-xs)"></div><div class="nm">xs</div><div class="hex">5px</div></div>
    <div class="col r"><div class="rbox" style="border-radius:var(--radius-sm)"></div><div class="nm">sm</div><div class="hex">7px</div></div>
    <div class="col r"><div class="rbox" style="border-radius:var(--radius-md)"></div><div class="nm">md</div><div class="hex">9px</div></div>
    <div class="col r"><div class="rbox" style="border-radius:var(--radius-lg)"></div><div class="nm">lg</div><div class="hex">12px</div></div>
    <div class="col r"><div class="rbox" style="border-radius:var(--radius-xl)"></div><div class="nm">xl</div><div class="hex">16px</div></div>
    <div class="col r"><div class="rbox" style="border-radius:var(--radius-pill);width:64px"></div><div class="nm">pill</div><div class="hex">999</div></div>
  </div>
</body></html>
