<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" />
<style>
  .mrow { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-family: var(--font-mono); }
  .mrow .lab { font-size: 10.5px; color: var(--text-3); width: 104px; flex: 0 0 104px; }
  .tc { font-size: 18px; color: var(--text-1); font-weight: 500; }
  .tag { font-size: 13px; color: var(--accent); }
  .val { font-size: 13px; }
  .val .ovr { color: var(--accent); } .val .inh { color: var(--text-3); font-style: italic; }
</style></head>
<body>
  <div class="eyebrow">Mono · JetBrains Mono — timecodes, values, ASS tags</div>
  <div class="mrow"><span class="lab">Timecode</span><span class="tc">0:13.04 / 0:42.18</span></div>
  <div class="mrow"><span class="lab">Cue value</span><span class="val"><span class="ovr">@12.88 / 180</span>&nbsp;&nbsp;<span class="inh">· none</span></span></div>
  <div class="mrow"><span class="lab">ASS tag</span><span class="tag">{\alpha&amp;HFF&amp;\t(0,180,\alpha&amp;H00&amp;)}</span></div>
  <div class="mrow"><span class="lab">Path</span><span class="val t2" style="color:var(--text-2)">~/out/bleating_subbed.mp4</span></div>
</body></html>
