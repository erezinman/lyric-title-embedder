<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" />
<style>
  .big { font-family: var(--font-display); font-weight: 700; font-size: 52px; letter-spacing: -.02em; line-height: 1; color: var(--text-1); }
  .big .g { background: linear-gradient(120deg, var(--accent), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .scale > div { display: flex; align-items: baseline; gap: 14px; margin-top: 10px; }
  .scale .lab { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); width: 96px; }
</style></head>
<body>
  <div class="eyebrow">Display · Space Grotesk</div>
  <div class="big">Caught in a <span class="g">bleating</span></div>
  <div class="scale" style="margin-top:18px">
    <div><span class="lab">Display / 700</span><span style="font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.015em">Generate captions</span></div>
    <div><span class="lab">H2 / 600</span><span style="font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.01em">Cue table · per-word fades</span></div>
    <div><span class="lab">H3 / 600</span><span style="font-family:var(--font-display);font-weight:600;font-size:16px">Animation presets</span></div>
  </div>
</body></html>
