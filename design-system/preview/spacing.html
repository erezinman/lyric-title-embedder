<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" />
<style>.srow{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bar{height:14px;background:linear-gradient(90deg,var(--accent),var(--violet));border-radius:3px}
.srow .nm{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);width:120px;flex:0 0 120px}</style></head>
<body>
  <div class="eyebrow">Spacing scale · 4px base</div>
  <div class="srow"><span class="nm">space-1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="srow"><span class="nm">space-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="srow"><span class="nm">space-3 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="srow"><span class="nm">space-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="srow"><span class="nm">space-6 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="srow"><span class="nm">space-8 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="srow"><span class="nm">space-12 · 48</span><div class="bar" style="width:48px"></div></div>
</body></html>
