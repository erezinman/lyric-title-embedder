<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" />
<style>
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{height:30px;padding:0 13px;border-radius:var(--radius-pill);font-size:12px;display:inline-flex;align-items:center;gap:7px;background:var(--surface-3);border:1px solid var(--border);color:var(--text-2)}
  .chip.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:#fff}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--glow-accent)}
  .chip.ghost{border-style:dashed;color:var(--text-3)}
  .badge{font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:5px}
  .badge.v{color:var(--violet-soft);background:color-mix(in srgb,var(--violet) 16%,transparent)}
  .badge.c{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 14%,transparent)}
  .badge.ver{color:var(--accent);border:1px solid var(--border-strong);background:color-mix(in srgb,var(--accent) 9%,transparent)}
</style></head>
<body>
  <div class="eyebrow">Animation presets &amp; tags</div>
  <div class="chips" style="margin-bottom:16px">
    <span class="chip on"><span class="dot"></span>Karaoke Bounce</span>
    <span class="chip">Pop</span><span class="chip">Glow</span><span class="chip">Typewriter</span>
    <span class="chip ghost">+ New</span>
  </div>
  <div class="chips">
    <span class="badge v">Bounce</span><span class="badge c">SOLO</span><span class="badge ver">v3</span>
  </div>
</body></html>
