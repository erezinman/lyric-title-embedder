<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" /></head>
<body>
  <div class="eyebrow">Semantic &amp; text</div>
  <div class="row tight" style="margin-bottom:16px">
    <div class="sw"><div class="chip" style="background:var(--success)"></div><div class="nm">success</div><div class="hex">#4DE0C2</div></div>
    <div class="sw"><div class="chip" style="background:var(--warn)"></div><div class="nm">warn</div><div class="hex">#FFC24D</div></div>
    <div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="nm">danger</div><div class="hex">#FF6B6B</div></div>
  </div>
  <div class="row tight">
    <div class="sw"><div class="chip" style="background:var(--text-1)"></div><div class="nm">text-1</div><div class="hex">#ECE7F4</div></div>
    <div class="sw"><div class="chip" style="background:var(--text-2)"></div><div class="nm">text-2</div><div class="hex">#A599BC</div></div>
    <div class="sw"><div class="chip" style="background:var(--text-3)"></div><div class="nm">text-3</div><div class="hex">#6E6385</div></div>
  </div>
</body></html>
