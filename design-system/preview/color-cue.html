<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" />
<style>.band{height:34px;border-radius:7px;display:flex;align-items:center;padding:0 12px;font-family:var(--font-display);font-weight:600;font-size:13px;color:#fff;margin-bottom:6px}
.lane{width:100%}</style></head>
<body>
  <div class="eyebrow">Cue-group palette — bands behind grouped words / events</div>
  <div class="lane">
    <div class="band" style="background:var(--cue-1)">Verse 1 · 0.30–3.10</div>
    <div class="band" style="background:var(--cue-2)">Chorus · 3.70–6.85</div>
    <div class="band" style="background:var(--cue-3)">Verse 2</div>
  </div>
  <div class="row tight" style="margin-top:10px">
    <div class="dot-sw" style="background:var(--cue-4)"></div><div class="dot-sw" style="background:var(--cue-5)"></div>
    <div class="dot-sw" style="background:var(--cue-6)"></div><div class="dot-sw" style="background:var(--cue-7)"></div>
    <div class="dot-sw" style="background:var(--cue-8)"></div><div class="dot-sw" style="background:var(--cue-9)"></div>
    <div class="dot-sw" style="background:var(--cue-10)"></div>
  </div>
</body></html>
