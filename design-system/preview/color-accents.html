<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" />
<style>.chip.glow1{box-shadow:0 6px 22px var(--glow-accent)}.chip.glow2{box-shadow:0 6px 22px var(--glow-violet)}.chip.glow3{box-shadow:0 6px 22px var(--glow-cyan)}
.ink{font-family:var(--font-mono);font-size:10px;color:var(--text-3)}</style></head>
<body>
  <div class="eyebrow">Brand accents · electric, used sparingly</div>
  <div class="row tight">
    <div class="sw"><div class="chip glow1" style="background:var(--accent)"></div><div class="nm">accent</div><div class="hex">#FF3DA6 · magenta</div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-press)"></div><div class="nm">accent-press</div><div class="hex">#E22E92</div></div>
    <div class="sw"><div class="chip glow2" style="background:var(--violet)"></div><div class="nm">violet</div><div class="hex">#8A5BFF · group</div></div>
    <div class="sw"><div class="chip glow3" style="background:var(--cyan)"></div><div class="nm">cyan</div><div class="hex">#3DE0FF · live</div></div>
    <div class="sw"><div class="chip" style="background:linear-gradient(120deg,var(--accent),var(--violet))"></div><div class="nm">gradient</div><div class="hex">CTA / logo</div></div>
  </div>
</body></html>
