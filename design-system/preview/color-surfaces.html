<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" /></head>
<body>
  <div class="eyebrow">Surfaces &amp; borders · violet-black</div>
  <div class="row tight">
    <div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="nm">bg</div><div class="hex">#0C0A14</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-1)"></div><div class="nm">surface-1</div><div class="hex">#15111F</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="nm">surface-2</div><div class="hex">#1A1528</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-3)"></div><div class="nm">surface-3</div><div class="hex">#221B33</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-4)"></div><div class="nm">surface-4</div><div class="hex">#241C36</div></div>
    <div class="sw"><div class="chip" style="background:var(--border);border-color:transparent"></div><div class="nm">border</div><div class="hex">#2C2440</div></div>
    <div class="sw"><div class="chip" style="background:var(--border-strong);border-color:transparent"></div><div class="nm">border-strong</div><div class="hex">#3A3052</div></div>
  </div>
</body></html>
