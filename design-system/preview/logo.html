<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" /><link rel="stylesheet" href="card.css" />
<style>
  body{display:flex;align-items:center;gap:40px}
  .lockup{display:flex;align-items:center;gap:12px}
  .lockup img{width:40px;height:40px;display:block;filter:drop-shadow(0 4px 16px var(--glow-accent))}
  .wm{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:-.01em;color:var(--text-1)}
  .ver{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--border-strong);border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .tiles{display:flex;gap:14px;align-items:center}
  .tiles img{width:56px;height:56px}
  .onaccent{width:56px;height:56px;border-radius:15px;background:linear-gradient(150deg,var(--accent),var(--violet));display:grid;place-items:center}
  .onaccent img{width:40px;height:40px}
</style></head>
<body>
  <div class="lockup">
    <img src="../assets/logo-mark.svg" alt="logo" />
    <span class="wm">Karaoke Subtitle Studio</span>
    <span class="ver">v3</span>
  </div>
  <div class="tiles">
    <img src="../assets/logo-mark.svg" alt="app mark" />
    <img src="../assets/logo-glyph.svg" alt="glyph on dark" />
  </div>
</body></html>
